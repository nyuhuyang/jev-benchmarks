latency_paraphrases:
- Select the best category.
- Which category fits best?
- Identify the most suitable category.
- Choose one category for this text.
- Classify the text into one category.
- What is the primary category?
- Pick the closest category.
- Assign the text to its best category.
- Which category describes the text?
- Return the single best category.
dataset:
  split_counts:
    default:
      pilot: 30
      calibration: 200
      test: 300
    massive:
      pilot: 30
      calibration: 200
      test: 100
  permutation_items: 100
  # Amendment 6: order sensitivity on AG News only; latency suite removed.
  permutation_datasets: [agnews]
  latency_items: 0
  datasets:
  - name: agnews
    kind: btzsc
    task: topic
    repository: btzsc/btzsc
    configuration: agnews
    source_split: test
    revision: fef2a2ac62b69c58670047dddf045c53d7c3cb5e
    instructions: Which single label best describes the input text?
  - name: emotiondair
    kind: btzsc
    task: emotion
    repository: btzsc/btzsc
    configuration: emotiondair
    source_split: test
    revision: fef2a2ac62b69c58670047dddf045c53d7c3cb5e
    instructions: Which single label best describes the input text?
  - name: banking77
    kind: btzsc
    task: intent
    repository: btzsc/btzsc
    configuration: banking77
    source_split: test
    revision: fef2a2ac62b69c58670047dddf045c53d7c3cb5e
    instructions: Which single label best describes the input text?
  - name: sms_spam
    kind: sms
    task: spam
    repository: ucirvine/sms_spam
    source_split: train
    revision: cae486f927c250fe1d4a5b55f11357964ed1646c
    labels:
    - An ordinary personal or service message that is not spam.
    - 'Spam: unsolicited advertising, prize or lottery claims, scams or phishing.'
    instructions: Is this SMS message spam?
  - name: civil_comments
    kind: civil_comments
    task: toxicity
    repository: google/civil_comments
    source_split: train
    revision: f2970eb3a55777454c94069077cc8d9b5866312d
    labels:
    - Not toxic.
    - 'Toxic: rude, disrespectful, insulting, obscene, threatening or hateful.'
    instructions: Is this comment toxic?
  - name: ultrafeedback_helpfulness
    kind: ultrafeedback
    task: helpfulness_score
    repository: openbmb/UltraFeedback
    source_split: train
    revision: 40b436560ca83a8dba36114c22ab3c66e43f6d5e
    data_files:
    - truthful_qa.jsonl
    - false_qa.jsonl
    aspect: helpfulness
    labels:
    - '1: Severely incorrect or unhelpful'
    - '2: Partially incorrect'
    - '3: Correct'
    - '4: Highly informative'
    - '5: Outstandingly helpful'
    instructions: How helpful is the response to the question?
  - name: massive_en
    kind: massive
    task: intent
    repository: AmazonScience/massive
    source_split: train
    data_files:
    - en-US/test/*.parquet
    locale: en-US
    revision: ed58ac423a2f4121720918bf5301577edce4ffd3
    instructions: Which single label best describes the input text?
  - name: massive_zh
    kind: massive
    task: intent
    repository: AmazonScience/massive
