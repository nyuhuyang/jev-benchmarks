    source_split: test
    revision: fef2a2ac62b69c58670047dddf045c53d7c3cb5e
    instructions: Which single label best describes the input text?
  - name: sms_spam
    kind: sms
    task: spam
    repository: ucirvine/sms_spam
    source_split: train
    revision: TODO-PIN-SMS-SPAM
    labels:
    - An ordinary personal or service message that is not spam.
    - 'Spam: unsolicited advertising, prize or lottery claims, scams or phishing.'
    instructions: Is this SMS message spam?
  - name: civil_comments
    kind: civil_comments
    task: toxicity
    repository: google/civil_comments
    source_split: train
    revision: TODO-PIN-CIVIL-COMMENTS
    labels:
    - Not toxic.
    - 'Toxic: rude, disrespectful, insulting, obscene, threatening or hateful.'
    instructions: Is this comment toxic?
  - name: yelp_review_full
    kind: yelp
    task: sentiment_score
    repository: Yelp/yelp_review_full
    source_split: test
    revision: TODO-PIN-YELP-REVIEW-FULL
    labels:
    - 1 star
    - 2 stars
    - 3 stars
    - 4 stars
    - 5 stars
    instructions: How many stars does this Yelp review give?
  - name: massive_en
    kind: massive
    task: intent
    repository: AmazonScience/massive
    configuration: en-US
    source_split: test
    locale: en-US
    revision: TODO-PIN-MASSIVE
    instructions: Which single label best describes the input text?
  - name: massive_zh
