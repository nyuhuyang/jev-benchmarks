latency_paraphrases:
- Select the best category.
- Which category fits best?
- Identify the most suitable category.
- Choose one category for this text.
- Classify the text into one category.
- What is the primary category?
- Pick the closest category.
- Assign the text to its best category.
- Which category describes the text?
- Return the single best category.
