      test: 300
    massive:
      pilot: 30
      calibration: 200
      test: 100
  permutation_items: 100
  latency_items: 100
  datasets:
  - name: agnews
    kind: btzsc
    task: topic
    repository: btzsc/btzsc
    configuration: agnews
    source_split: test
    revision: fef2a2ac62b69c58670047dddf045c53d7c3cb5e
    instructions: Which single label best describes the input text?
  - name: emotiondair
    kind: btzsc
    task: emotion
